<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Godot Game</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #f2f4f6; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #load-notice { position: fixed; top: 0; left: 0; padding: 8px; background: white; font: 14px sans-serif; z-index: 1; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <div id="load-notice" role="status">게임을 불러오는 중…</div>
  <canvas id="canvas" tabindex="0">WebGL을 지원하는 브라우저가 필요합니다.</canvas>
  <script src="$GODOT_URL"></script>
  <script>
    const engine = new Engine($GODOT_CONFIG);
    engine.startGame().then(() => {
      document.getElementById('load-notice').remove();
    }).catch(error => {
      document.getElementById('load-notice').textContent = String(error);
      console.error(error);
    });
  </script>
</body>
</html>
